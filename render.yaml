services:
  - type: web
    name: criminal-face-detection-backend
    env: python
    buildCommand: pip install https://github.com/z-a-f/dlib-wheels/releases/download/v19.22/dlib-19.22.99-cp310-cp310-linux_x86_64.whl && pip install -r requirements.txt
    startCommand: uvicorn Backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13